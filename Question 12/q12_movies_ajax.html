<!DOCTYPE html>
<html>
<head>
<style>
table { border-collapse: collapse; width: 100%; }
td, th { border: 1px solid #333; padding: 5px; }
img { width: 50px; }
</style>
</head>
<body>

<table id="movieTable">
<tr>
<th>ID</th><th>Title</th><th>Poster</th><th>Year</th><th>Genre</th>
<th>Rating</th><th>Director</th><th>Country</th><th>Language</th><th>Actors</th>
</tr>
</table>

<script>
fetch("movies.json")
    .then(response => response.json())
    .then(data => {
        let table = document.getElementById("movieTable");
        data.forEach(movie => {
            let row = table.insertRow();
            row.insertCell().innerText = movie.id;
            row.insertCell().innerText = movie.title;
            row.insertCell().innerHTML = "<img src='" + movie.poster + "'>";
            row.insertCell().innerText = movie.year;
            row.insertCell().innerText = movie.genre;
            row.insertCell().innerText = movie.rating;
            row.insertCell().innerText = movie.director;
            row.insertCell().innerText = movie.country;
            row.insertCell().innerText = movie.language;
            row.insertCell().innerText = movie.actors;
        });
    });
</script>

</body>
</html>
