<!DOCTYPE html>
<html>
<head>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
#box { width: 150px; height: 150px; background: teal; margin-top: 20px; }
</style>
</head>
<body>

<button id="hide">Hide</button>
<button id="show">Show</button>
<button id="toggle">Toggle</button>
<button id="fadeIn">Fade In</button>
<button id="fadeOut">Fade Out</button>
<button id="fadeToggle">Fade Toggle</button>
<button id="slideUp">Slide Up</button>
<button id="slideDown">Slide Down</button>
<button id="slideToggle">Slide Toggle</button>
<button id="animate">Animate</button>

<div id="box"></div>

<script>
$("#hide").click(function(){ $("#box").hide(); });
$("#show").click(function(){ $("#box").show(); });
$("#toggle").click(function(){ $("#box").toggle(); });
$("#fadeIn").click(function(){ $("#box").fadeIn(); });
$("#fadeOut").click(function(){ $("#box").fadeOut(); });
$("#fadeToggle").click(function(){ $("#box").fadeToggle(); });
$("#slideUp").click(function(){ $("#box").slideUp(); });
$("#slideDown").click(function(){ $("#box").slideDown(); });
$("#slideToggle").click(function(){ $("#box").slideToggle(); });
$("#animate").click(function(){ $("#box").animate({left: "250px", opacity: 0.5}); });
</script>

</body>
</html>
